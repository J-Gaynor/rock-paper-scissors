<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>

<body>
    <div class="container">
        <div class="rps-container">
            <div class="results-container">
                <div class="scores">
                    <p>
                        User Score:
                        <span id="human-score"></span>
                    </p>
                    <p>
                        Computer Score:
                        <span id="computer-score"></span>
                    </p>
                </div>
                <h1 id="result"></h1>
            </div>
            <div class="buttons">
                <button id="rock" value="rock">Rock 🪨</button>
                <button id="paper" value="paper">Paper 📄</button>
                <button id="scissors" value="scissors">Scissors ✂️</button>
            </div>
            <div class="winner-container">
                <h1 class="winner"></h1>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
